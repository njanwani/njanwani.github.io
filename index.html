<head>

  <style type="text/css">

      color: #1772d0;
      text-decoration: none;
    }

    a:focus,
    a:hover {
      color: #f09228;
      text-decoration: none;
    }

    body,
    td,
    th,
    tr,
    p {
      font-family: 'Lato', Verdana, Helvetica, sans-serif;
      font-size: 15px
    }

    abs {
      font-family: 'Lato';
      font-style: italic;
      font-size: 14px
    }

    a {
      font-family: 'Lato', Verdana, Helvetica, sans-serif;
      font-size: 15px
    }

    strong {
      font-family: 'Lato', Verdana, Helvetica, sans-serif;
      font-size: 15px;
    }

    heading {
      font-family: 'Lato', Verdana, Helvetica, sans-serif;
      font-size: 22px;
    }

    papertitle {
      font-family: 'Lato', Verdana, Helvetica, sans-serif;
      font-size: 18px;
      font-weight: 700
    }

    name {
      font-family: 'Lato';
      font-size: 40px;
    }

    .one {
      width: 160px;
      height: 160px;
      position: relative;
    }

    .two {
      width: 160px;

      background-color: #ffffd0;

  </style>
  <script type="text/javascript" src="js/hidebib.js"></script>
  <title>Neil Janwani</title>
  <meta http-equiv="Content-Type" content="text/html; charset=us-ascii">
  <link href='https://fonts.googleapis.com/css?family=Lato:400,700,400italic,700italic' rel='stylesheet' type='text/css'>
  <link rel="icon" href="images/favicon/handshake.png" type="image/png">
</head>

<body>

  <table width="800" border="0" align="center" cellspacing="0" cellpadding="0">
    <tr>
      <td>
        <!-- Introduction Section -->
        <div id="intro"></div>

        <!-- Papers Section -->
        <div id="papers"></div>

        <table width="100%" align="center" border="0" cellspacing="0" cellpadding="20">
          <tr>
            <td>
              <br>
              <p align="right">
                <font size="2">
                  Website design courtesy of <a href="https://jonbarron.info/"><strong>Jon Barron</strong></a>
                </font>
              </p>
            </td>
          </tr>
        </table>

        </td>
    </tr>
  </table>

  <script xml:space="preserve" language="JavaScript">
    function toggleblock(id) {
      var element = document.getElementById(id);
      if (element.style.display == 'none')
        element.style.display = 'block';
      else
        element.style.display = 'none';
    }

    function hideallabs() {
      var elements = document.getElementsByTagName('abs');
      for (var i = 0; i < elements.length; i++)
        elements[i].style.display = 'none';
    }

    async function loadPapers() {
      try {
        const response = await fetch('data/papers.json');
        const papers = await response.json();
        const container = document.getElementById('papers-container');

        if (!container) return;
        container.innerHTML = '';

        papers.forEach(paper => {
          const authorsHtml = paper.authors.map(author => {
            let authorHtml = author.highlight ? `<strong>${author.name}</strong>` : author.name;
            if (author.superscript) {
              authorHtml += `<sup>${author.superscript}</sup>`;
            }
            return authorHtml;
          }).join(', ');

          const paperRow = document.createElement('table');
          paperRow.width = '100%';
          paperRow.align = 'center';
          paperRow.border = '0';
          paperRow.cellSpacing = '0';
          paperRow.cellPadding = '20';

          paperRow.innerHTML = `
            <tr>
              <td width="40%" valign="top" align="center">
                <img src="${paper.thumbnail}" alt="${paper.thumbnailAlt}" width="300" style="padding-top:0px;padding-bottom:0px;border-radius:15px;border:1px solid black">
              </td>
              <td width="60%" valign="top">
                <p><a href="${paper.website || paper.arxivUrl}">
                <papertitle>${paper.title}</papertitle></a><br>
                ${authorsHtml}<br>
                <em>${paper.venue}</em>, ${paper.year}
                <br>
                </p>

                <div class="paper" id="${paper.id}">
                    <a href="${paper.arxivUrl}">arXiv</a> |
                    ${paper.code ? `<a href="${paper.code}">code</a> | ` : ''}
                    <a href="javascript:toggleblock('${paper.id}_abs')">abstract</a>

                    <abs align="justify" id="${paper.id}_abs"> ${paper.abstract}</abs>

                </div>
              </td>
            </tr>
          `;

          container.appendChild(paperRow);
        });

        hideallabs();
      } catch (error) {
        console.error('Error loading papers:', error);
      }
    }

    function loadSection(file, elementId) {
      fetch(file)
        .then(response => response.text())
        .then(html => {
          document.getElementById(elementId).innerHTML = html;
          if (elementId === 'papers') {
            loadPapers();
          } else {
            hideallabs();
          }
        });
    }

    loadSection('sections/intro.html', 'intro');
    loadSection('sections/papers.html', 'papers');
  </script>
</body>

</html>
